<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Contact — Majestic Print Solutions</title>
  <meta name="description" content="Contact Majestic Print Solutions and request a quote.">
  <meta name="theme-color" content="#13477A">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=11">
  <link rel="stylesheet" href="assets/css/pages.css?v=10">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body data-page="contact">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="siteHeader"></div>

  <main id="main">
    <section class="page-head" id="pageHead" aria-label="Page heading"></section>
    <div id="pageBody"></div>
    <section class="section section-tint" id="quote" aria-labelledby="quote-title">
      <div class="container-xl">
        <div class="contact-grid">
          <div>
            <div class="ticket ql-ticket" id="quoteList" aria-live="polite"></div>
            <div class="contact-card">
              <p class="kicker">Visit or call</p>
              <ul class="contact-list" id="contactList"></ul>
            </div>
          </div>
          <div class="quote-card">
            <h2 id="quote-title" class="quote-title">Your brief</h2>
            <form id="quoteForm" novalidate>
              <div class="row g-4">
                <div class="col-sm-6">
                  <label class="form-label" for="qName">Your name</label>
                  <input class="form-control" id="qName" name="name" autocomplete="name" maxlength="80" required>
                  <div class="field-error" id="qNameError"></div>
                </div>
                <div class="col-sm-6">
                  <label class="form-label" for="qService">What do you need?</label>
                  <select class="form-select" id="qService" name="service">
                    <option value="">Choose a service</option>
                  </select>
                  <div class="field-error" id="qServiceError"></div>
                </div>
                <div class="col-sm-6">
                  <label class="form-label" for="qQty">Quantity <span class="optional">(optional)</span></label>
                  <input class="form-control" id="qQty" name="quantity" inputmode="numeric" maxlength="12" placeholder="e.g. 500">
                </div>
                <div class="col-sm-6">
                  <label class="form-label" for="qDate">Needed by <span class="optional">(optional)</span></label>
                  <input class="form-control" id="qDate" name="date" type="date">
                </div>
                <div class="col-12">
                  <label class="form-label" for="qDetails">Describe your project</label>
                  <textarea class="form-control" id="qDetails" name="details" rows="5" maxlength="800" placeholder="Size, material, colours, where it will be used…"></textarea>
                  <div class="field-error" id="qDetailsError"></div>
                </div>
                <div class="col-12">
                  <button class="btn-mp btn-mp-accent" type="submit">Prepare my brief</button>
                  <p class="fine-print mt-3">Nothing is sent until you tap send in WhatsApp.</p>
                </div>
              </div>
            </form>
            <div class="brief" id="brief" hidden>
              <span class="stamp stamp-ready" aria-hidden="true">Ready</span>
              <p class="slug">Project brief</p>
              <dl class="brief-list" id="briefList"></dl>
              <div class="brief-actions">
                <a class="btn-mp btn-mp-whatsapp" id="briefSend" href="#" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp" aria-hidden="true"></i> Send on WhatsApp</a>
                <button class="btn-mp btn-mp-ghost" type="button" id="briefEdit">Edit details</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="assets/data.js?v=9" defer></script>
  <script src="assets/js/common.js?v=10" defer></script>
  <script src="assets/js/pages.js?v=10" defer></script>
</body>
</html>
